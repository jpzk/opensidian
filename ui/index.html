<!doctype html>
<html><head><meta charset="utf-8"><title>rustidian</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<div id="side">
  <div id="bar">
    <button id="newbtn" title="new note">+</button>
    <button id="graphbtn" title="graph view">◉</button>
  </div>
  <ul id="notes"></ul>
</div>
<div id="main">
  <textarea id="editor" spellcheck="false" placeholder="# write markdown, link with [[Note]]"></textarea>
  <div id="preview"></div>
  <canvas id="graph" hidden></canvas>
</div>
<script src="main.js"></script>
</body></html>
