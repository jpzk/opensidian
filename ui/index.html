<!doctype html>
<html><head><meta charset="utf-8"><title>rustidian</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<div id="ribbon">
  <button id="collapsebtn" title="Collapse sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
  <button id="graphbtn" title="Open graph view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="10" cy="18" r="2.5"/><path d="M8.2 7.2l7.4 0M7 8.3l2 7.4M16.5 10l-5 6"/></svg></button>
  <button id="lgbtn" title="Open local graph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.5"/><circle cx="5" cy="5" r="1.5"/><circle cx="19" cy="6" r="1.5"/><circle cx="6" cy="19" r="1.5"/><path d="M9.6 9.7L6.1 6.1M14.9 10.2l3-3M10.2 15l-3 2.8"/></svg></button>
</div>
<div id="side">
  <div id="stabs">
    <button id="stab-files" class="stab active" title="Files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
    <button id="stab-search" class="stab" title="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
    <button id="stab-bm" class="stab" title="Bookmarks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg></button>
  </div>
  <div id="pane-files" class="spane">
    <div id="bar">
      <button id="newbtn" title="New note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9z"/><path d="M14 3v6h6"/><path d="M12 12v6M9 15h6"/></svg></button>
      <button id="newfolderbtn" title="New folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v6M9 14h6"/></svg></button>
    </div>
    <div id="fnew" hidden><input id="fname" placeholder="folder name" spellcheck="false"></div>
    <div id="tree"></div>
  </div>
  <div id="pane-search" class="spane" hidden>
    <div id="sbar"><input id="sinput" placeholder="Search..." spellcheck="false"><button id="sclear" title="Clear search">✕</button></div>
    <div id="sresults"></div>
  </div>
  <div id="pane-bm" class="spane" hidden></div>
  <div id="vswitch" title="switch vault"></div>
</div>
<div id="main"><!-- split tree rendered here: .split nodes, .pane leaves (M6) --></div>
<div id="picker" hidden>
  <div id="pcard">
    <button id="p-close" title="close" hidden>✕</button>
    <div id="ptitle">rustidian</div>
    <div id="p-actions">
      <div class="prow">
        <div class="ptext"><b>Create new vault</b><span>Create a new vault under a folder.</span></div>
        <button id="p-create">Create</button>
      </div>
      <div class="prow">
        <div class="ptext"><b>Open folder as vault</b><span>Choose an existing folder of Markdown files.</span></div>
        <button id="p-open">Open</button>
      </div>
    </div>
    <div id="p-sub" hidden>
      <input id="p-name" placeholder="Vault name" hidden>
      <input id="p-path" spellcheck="false" title="location">
      <ul id="p-dirs"></ul>
      <div id="p-err"></div>
      <div id="p-btns">
        <button id="p-back">Back</button>
        <button id="p-go"></button>
      </div>
    </div>
  </div>
</div>
<script src="main.js"></script>
</body></html>
