# SPDX-License-Identifier: GPL-3.0-or-later
# rustidian — flatpak manifest.
#
# RUNTIME CHOICE (docs/recon-flatpak/README.md, B2): org.gnome.Platform//49 is
# the runtime that still ships webkit2gtk-4.1 (2.52.5, measured with
# pkg-config INSIDE the SDK), which is the API tauri 2.5 links. 48 is EOL,
# 50 also carries 4.1; 49 is the current supported branch. Nothing is bundled.
#
# RUST comes from the SDK extension, not from the box: the toolchain inside the
# sandbox is what compiles, so a box with a different rustc cannot change the
# result. Version pinned in bin/hz/cloud-init.yaml (rust-stable//25.08).
#
# SOURCES: the module's own source is this checkout (`dir`), and every crate is
# a pinned crates.io archive generated from src-tauri/Cargo.lock by
# packaging/flatpak/gen-cargo-sources.sh into cargo-sources.json — run
# packaging/flatpak/build.sh, which generates it and then builds. The build
# itself needs NO network (flatpak-builder gives the build sandbox no network
# unless --share=network is asked for, and we never ask).
app-id: dev.koto.rustidian
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: rustidian

# FILESYSTEM: --filesystem=home is the vault decision, not a packaging detail —
# see B5. It is the weakest permission that lets a user open an arbitrary vault
# under $HOME without a portal round-trip on every file the editor touches.
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.portal.Desktop
  # WITHOUT THE NEXT LINE THE APP DOES NOT START (docs/recon-flatpak, item L).
  # flatpak points XDG_DATA_HOME at ~/.var/app/<id>/data; tauri resolves its
  # app-data dir through XDG_DATA_HOME; rustidian's OWN landlock ruleset
  # (src-tauri/src/sandbox.rs:82 write_roots) grants $HOME/.local/share/<id>
  # and nothing under ~/.var/app — so the first write tauri makes is refused by
  # the kernel and tauri panics "Failed to setup app: Permission denied (os
  # error 13)" one line after the app logs "landlock: FullyEnforced".
  # An EMPTY value is not a trick: the XDG basedir spec makes a non-absolute
  # XDG_DATA_HOME fall back to $HOME/.local/share — the same path the AppImage
  # build uses and the one landlock was already told about, so no path is
  # hardcoded here. Measured both ways: arm A (without) panics, arms C/F (with)
  # reach the tabbed editor with landlock still FullyEnforced —
  # evidence/L-launch.txt. Deleting this line reverts a launch to a panic.
  - --env=XDG_DATA_HOME=

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/rustidian/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: rustidian
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --manifest-path src-tauri/Cargo.toml
      - install -Dm755 src-tauri/target/release/rustidian /app/bin/rustidian
      - install -Dm644 src-tauri/icons/icon.png
        /app/share/icons/hicolor/128x128/apps/dev.koto.rustidian.png
      - install -Dm644 packaging/flatpak/dev.koto.rustidian.desktop
        /app/share/applications/dev.koto.rustidian.desktop
      - install -Dm644 packaging/flatpak/dev.koto.rustidian.metainfo.xml
        /app/share/metainfo/dev.koto.rustidian.metainfo.xml
    sources:
      # The checkout being built. For a Flathub submission this becomes
      #   - type: git
      #     url: https://github.com/<org>/rustidian.git
      #     tag: v0.11.0
      #     commit: <full sha of the tag>
      # which is the same tree with a checksum Flathub can verify; everything
      # below is unchanged.
      - type: dir
        path: ../..
        skip:
          - .git
          - dist
          - src-tauri/target
      # generated by packaging/flatpak/build.sh into dist/flatpak (gitignored):
      # the file is a build artifact of Cargo.lock, so it is generated, never
      # committed, and lives outside packaging/ to keep the tree clean.
      - ../../dist/flatpak/cargo-sources.json
