# SPDX-License-Identifier: GPL-3.0-or-later
# sync-crypto: the suite + CryptoProvider trait (docs/sync/spec.md, key-tree.md). No network code.
# Workspace member; the workspace root is src-tauri/ (keeps src-tauri/Cargo.lock
# and src-tauri/target where CI and the harness expect them). Dependencies are
# pinned exact to versions ALREADY in src-tauri/Cargo.lock — see docs/sync/deps.md.
[package]
name = "sync-crypto"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
workspace = "../../src-tauri"

[dependencies]
sha2 = "=0.10.9"
# M2 suite v1 (docs/sync/cmvp.md §9, deps.md): AWS-LC FIPS module via aws-lc-rs, pinned to
# the CMVP-VALIDATED line (operator 2026-11-19): aws-lc-fips-sys 0.13.11 vendors AWS-LC FIPS
# 3.1.0 byte-identical to the #5314 Security Policy source zip; aws-lc-rs 1.16.0 is the newest
# release whose own tree ships fips-sys 0.13.11. fips-sys is pinned directly so the resolver cannot
# float it. Building it needs CMake + Go + cc (box toolchain in deps.md).
aws-lc-rs = { version = "=1.16.0", default-features = false, features = ["fips", "alloc"] }
aws-lc-fips-sys = "=0.13.11"
# aws-lc-rs needs zeroize ^1.8.1; 1.9.2 (2026-11-17) is < 6 weeks old -> pin 1.9.1
# (2026-10-06). Also used directly to wipe key material.
zeroize = "=1.9.1"

[dev-dependencies]
# Wycheproof JSON vectors (tests/wycheproof.rs); same pin as sync-proto/sync-core.
serde_json = "=1.0.151"
