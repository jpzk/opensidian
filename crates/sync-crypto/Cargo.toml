# SPDX-License-Identifier: GPL-3.0-or-later
# sync-crypto: the suite + CryptoProvider trait (docs/sync/spec.md, key-tree.md). No network code.
# Workspace member; the workspace root is src-tauri/ (keeps src-tauri/Cargo.lock
# and src-tauri/target where CI and the harness expect them). Dependencies are
# pinned exact to versions ALREADY in src-tauri/Cargo.lock — see docs/sync/deps.md.
[package]
name = "sync-crypto"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
workspace = "../../src-tauri"

[dependencies]
sha2 = "=0.10.9"
# M2 suite v1 (docs/sync/cmvp.md, deps.md): AWS-LC FIPS module via aws-lc-rs. Newest
# release >= 6 weeks old at 2026-11-18 = aws-lc-rs 1.18.1 / aws-lc-fips-sys 0.14.2
# (AWS-LC 4.2.0, CMVP: in process). fips-sys is pinned directly so the resolver cannot
# float it. Building it needs CMake + Go + cc (box toolchain in deps.md).
aws-lc-rs = { version = "=1.18.1", default-features = false, features = ["fips", "alloc"] }
aws-lc-fips-sys = "=0.14.2"
