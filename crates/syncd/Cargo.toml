# SPDX-License-Identifier: GPL-3.0-or-later
# syncd: opensidian-syncd — SyncApi (LocalEngine | IpcClient), the user-service daemon
# (unix socket 0700 + SO_PEERCRED) and the CLI (M6a).
# Workspace member; the workspace root is src-tauri/ (keeps src-tauri/Cargo.lock
# and src-tauri/target where CI and the harness expect them). Dependencies are
# pinned exact to versions ALREADY in src-tauri/Cargo.lock — see docs/sync/deps.md.
[package]
name = "syncd"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
workspace = "../../src-tauri"

[lib]
name = "syncd"
path = "src/lib.rs"

[dependencies]
sync-core = { path = "../sync-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# history bytes on the daemon socket as one base64 string (not a JSON number
# array); same version sync-core already locks, no new crate in the tree.
base64 = "=0.22.1"
zeroize = "=1.9.1"
# SO_PEERCRED through tokio's safe UnixStream::peer_cred (std's is unstable; no unsafe
# here). Already locked (sync-server); only the rt + net features.
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "net"] }

[dev-dependencies]
sync-server = { path = "../sync-server" }
tokio = { version = "=1.53.1", default-features = false, features = ["rt-multi-thread", "net", "sync", "time"] }

[[bin]]
name = "opensidian-syncd"
path = "src/main.rs"
