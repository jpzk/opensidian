[package]
name = "opensidian"
version = "0.6.0"
edition = "2021"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
tauri = { version = "2.5", features = [] }
serde = { version = "1", features = ["derive"] }
# preserve_order: unknown keys and opaque entries in .obsidian/bookmarks.json
# must round-trip in FILE order (goal bmcompat, criterion 4) — indexmap 2.x
# was already in the lock, this adds no new crate.
serde_json = { version = "1", features = ["preserve_order"] }
pulldown-cmark = "0.13"
# graphctx: /regex/ terms in the graph Filters + Groups query (graphq.rs). ALREADY in
# Cargo.lock at 1.13.1 (a transitive dep of the tauri tree); `=` pins that version,
# so the lock gains no package.
regex = "=1.13.1"
# pdfembed — PDF embeds rasterised in Rust (pure Rust, Apache-2.0 OR MIT, no JS /
# action / form engine). Published 2026-06-05, sha256 c4caa128…f56d; the +32 crates
# it brings are listed with date/licence/sha in harness docs/recon-pdfembed/data/
# renderer-crates.txt, all >= 6 weeks old, resolved with --precise pins (never
# "latest"). Design: harness docs/recon-pdfembed/README.md "security design".
hayro = "=0.7.1"
landlock = "=0.4.7"
# vaultfs: openat/renameat/mkdirat/unlinkat with O_NOFOLLOW so vault writes never
# follow a symlink. ALREADY in Cargo.lock (transitive via tauri/landlock); `=`
# pins it to that exact version, so the lock gains no package.
libc = "=0.2.189"

# R33.6b — the POSITIVE session test behind the two-path drag (win_move_proto).
# Both crates are ALREADY in Cargo.lock as tauri's own transitive deps (tauri ->
# tao -> gtk/gdk/gdkx11 0.18.2), so naming them here resolves to the versions the
# webview is already linked against and fetches nothing new; `=` because a gdk
# that is not tauri's gdk would hand us a DIFFERENT GdkDisplay type and the
# downcast that detects X11-vs-Wayland would silently answer "wayland" everywhere.
[target.'cfg(target_os = "linux")'.dependencies]
gdk = "=0.18.2"
gdkx11 = "=0.18.2"

# listtoggle A2 — the unit table runs ui/editor.js in JavaScriptCore, the engine
# the webview runs it in. javascriptcore-rs 1.1.2 is ALREADY in Cargo.lock as
# webkit2gtk's own dependency; `=` pins it to that locked version, so this
# fetches and trusts nothing new. Test-only: the shipped binary is unchanged.
[target.'cfg(target_os = "linux")'.dev-dependencies]
javascriptcore-rs = "=1.1.2"

# goal themes4 — builtins.rs pins every vendored theme file by sha256. sha2
# 0.10.9 is ALREADY in Cargo.lock (tauri's own build-time dependency); `=`
# pins it to that locked version, so this fetches and trusts nothing new.
# Test-only: the shipped binary is unchanged.
[dev-dependencies]
sha2 = "=0.10.9"

# Release binaries ship STRIPPED (symbol table removed at link time). The one release
# compile is wrapped byte-identical into the AppImages, rpm and deb; Debian policy 10.1
# (lintian E: unstripped-binary-or-object) and Fedora both expect stripped binaries, and
# stripping AFTER the compile would break the one-compile-one-sha proof. Panics still
# print their message and location; only symbolised backtraces are lost.
[profile.release]
strip = "symbols"
