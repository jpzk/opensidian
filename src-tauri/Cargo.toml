[package]
name = "opensidian"
version = "0.9.1"
edition = "2021"
license = "GPL-3.0-or-later"

# lib.rs: the pure parse/normalize modules (vaultfs, outline, index, graphq,
# canvasfs, datefmt) as a tauri-free library so fuzz/ can link them. The bin
# (main.rs) keeps its name "opensidian" and uses this lib.
[lib]
name = "opensidian_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
# `devtools`: inspector in release too (toggle via F12 / OPENSIDIAN_DEVTOOLS=1).
# Debug builds already expose it; the feature is what WebView2 needs in --release.
tauri = { version = "2.5", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: unknown keys and opaque entries in .obsidian/bookmarks.json
# must round-trip in FILE order (goal bmcompat, criterion 4) — indexmap 2.x
# was already in the lock, this adds no new crate.
serde_json = { version = "1", features = ["preserve_order"] }
pulldown-cmark = "0.13"
# graphctx: /regex/ terms in the graph Filters + Groups query (graphq.rs). ALREADY in
# Cargo.lock at 1.13.1 (a transitive dep of the tauri tree); `=` pins that version,
# so the lock gains no package.
regex = "=1.13.1"
# pdfembed — PDF embeds rasterised in Rust (pure Rust, Apache-2.0 OR MIT, no JS /
# action / form engine). Published 2026-06-05, sha256 c4caa128…f56d; the +32 crates
# it brings are listed with date/licence/sha in harness docs/recon-pdfembed/data/
# renderer-crates.txt, all >= 6 weeks old, resolved with --precise pins (never
# "latest"). Design: harness docs/recon-pdfembed/README.md "security design".
hayro = "=0.7.1"

# cp-browser — the plugin store (plugin_store.rs). NO NEW CRATE: both are
# ALREADY in Cargo.lock as tauri/webkit dependencies, `=` pins the locked version.
#   url  2.5.8  (2026-01-05, MIT OR Apache-2.0)  allowlist / redirect parsing
#   sha2 0.10.9 (2025-04-30, MIT OR Apache-2.0)  sha256 of every installed file
#        (was dev-only for builtins.rs; now also shipped). soup3: linux block below
sha2 = "=0.10.9"
url = "=2.5.8"

# goal settings-general — the signed update check (updates.rs) verifies the release
# SHA256SUMS.asc (OpenPGP, EdDSA) against the embedded pinned key. ONE NEW CRATE:
#   ed25519-compact 2.4.2 (2026-08-19, MIT, sha256 f05391a5…41da), default
#   features OFF = zero dependencies (no getrandom, no pem): verify only. Picked as
#   the smallest Ed25519 verifier (vs ed25519-dalek's curve25519-dalek tree); the
#   newest release >= 6 weeks before 2026-10-19 (2.5.0/2.6.0 are 2026-09-25, too new).
#   SHA-512/256 come from the already-locked sha2 above; the OpenPGP packet subset is
#   hand-parsed in updates.rs (strict: v4, EdDSA, binary sig, pinned fingerprint).
ed25519-compact = { version = "=2.4.2", default-features = false }

# R33.6b — the POSITIVE session test behind the two-path drag (win_move_proto).
# Both crates are ALREADY in Cargo.lock as tauri's own transitive deps (tauri ->
# tao -> gtk/gdk/gdkx11 0.18.2), so naming them here resolves to the versions the
# webview is already linked against and fetches nothing new; `=` because a gdk
# that is not tauri's gdk would hand us a DIFFERENT GdkDisplay type and the
# downcast that detects X11-vs-Wayland would silently answer "wayland" everywhere.
[target.'cfg(target_os = "linux")'.dependencies]
# vaultfs: openat/renameat/mkdirat/unlinkat with O_NOFOLLOW so vault writes never
# follow a symlink. ALREADY in Cargo.lock (transitive via tauri/landlock); `=`
# pins it to that exact version, so the lock gains no package.
libc = "=0.2.189"
# Landlock self-sandbox (sandbox.rs). Linux-only LSM; never built on Windows.
landlock = "=0.4.7"
gdk = "=0.18.2"
gdkx11 = "=0.18.2"
# cp-browser: the plugin store's HTTPS client is libsoup 3 — the library webkit2gtk
# already links (TLS = glib-networking, system CA store). soup3 0.5.0 (2023-08-01,
# MIT) is webkit2gtk's own binding, ALREADY in Cargo.lock: no new crate, no new C lib.
soup3 = "=0.5.0"
# ---- cp-secrets (begin) ----
# app.secretStorage over the freedesktop Secret Service (src/secrets.rs). dbus
# 0.9.12 is ALREADY in Cargo.lock (tauri -> tao's own dependency, libdbus via
# libdbus-sys 0.2.7); `=` pins that locked version, so this fetches and trusts
# nothing new. MIT OR Apache-2.0.
dbus = "=0.9.12"
# ---- cp-secrets (end) ----

# Windows plugin-store HTTPS (plugin_store.rs). reqwest 0.13.4 is ALREADY in
# Cargo.lock (tauri transitive); rustls-tls avoids soup3/native OpenSSL. Pin `=`.
[target.'cfg(windows)'.dependencies]
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "rustls", "charset"] }

# listtoggle A2 — the unit table runs ui/editor.js in JavaScriptCore, the engine
# the webview runs it in. javascriptcore-rs 1.1.2 is ALREADY in Cargo.lock as
# webkit2gtk's own dependency; `=` pins it to that locked version, so this
# fetches and trusts nothing new. Test-only: the shipped binary is unchanged.
[target.'cfg(target_os = "linux")'.dev-dependencies]
javascriptcore-rs = "=1.1.2"

# goal themes4 — builtins.rs pins every vendored theme file by sha256. sha2
# 0.10.9 is ALREADY in Cargo.lock (tauri's own build-time dependency); `=`
# pins it to that locked version, so this fetches and trusts nothing new.
# Test-only: the shipped binary is unchanged.
[dev-dependencies]
sha2 = "=0.10.9"

# Release binaries ship STRIPPED (symbol table removed at link time). The one release
# compile is wrapped byte-identical into the AppImages, rpm and deb; Debian policy 10.1
# (lintian E: unstripped-binary-or-object) and Fedora both expect stripped binaries, and
# stripping AFTER the compile would break the one-compile-one-sha proof. Panics still
# print their message and location; only symbolised backtraces are lost.
[profile.release]
strip = "symbols"

# glib-fix (v0.8.1) — GHSA-wrw7-89jp-8q8g / RUSTSEC-2024-0429: VariantStrIter::impl_get
# passed `&p` as a variadic out-argument, UB. Fixed upstream only in glib >= 0.20
# (gtk-rs/gtk-rs-core PR 1343, commit b5a4071e); gtk3-rs 0.18 pins glib 0.18, so no bump.
# vendor/glib-0.18.5 = crates.io glib 0.18.5 byte-for-byte (sha256 233daaf6…0ee5, the
# Cargo.lock checksum) + exactly that two-line upstream hunk. Checked by harness
# scripts/glib-vendor-check.sh before every release.
[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }
