[package]
name = "rustidian"
version = "0.14.0"
edition = "2021"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
tauri = { version = "2.5", features = [] }
serde = { version = "1", features = ["derive"] }
# preserve_order: unknown keys and opaque entries in .obsidian/bookmarks.json
# must round-trip in FILE order (goal bmcompat, criterion 4) — indexmap 2.x
# was already in the lock, this adds no new crate.
serde_json = { version = "1", features = ["preserve_order"] }
pulldown-cmark = "0.13"
landlock = "=0.4.7"

# R33.6b — the POSITIVE session test behind the two-path drag (win_move_proto).
# Both crates are ALREADY in Cargo.lock as tauri's own transitive deps (tauri ->
# tao -> gtk/gdk/gdkx11 0.18.2), so naming them here resolves to the versions the
# webview is already linked against and fetches nothing new; `=` because a gdk
# that is not tauri's gdk would hand us a DIFFERENT GdkDisplay type and the
# downcast that detects X11-vs-Wayland would silently answer "wayland" everywhere.
[target.'cfg(target_os = "linux")'.dependencies]
gdk = "=0.18.2"
gdkx11 = "=0.18.2"
