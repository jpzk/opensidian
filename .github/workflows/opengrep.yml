# Opengrep SAST -> GitHub code scanning (SARIF, category "opengrep").
# Findings show as inline annotations on the PR via the code-scanning check.
#
# Scope: PRs from branches of THIS repository only. Fork PRs are out of
# scope: they get a read-only GITHUB_TOKEN (no security-events: write), so
# the job is skipped for them. Do NOT switch to the privileged PR trigger —
# that would run untrusted fork code with a write token.
#
# Supply chain: every action is pinned by full commit SHA; the opengrep
# binary is pinned by version + sha256 and checked with sha256sum -c; the
# community rules are pinned to a git commit SHA. All pins were published
# before 2026-10-04 (6-week rule). Bump deliberately, never automatically.
name: Opengrep

on:
  pull_request: {}
  schedule:
    # nightly, off the hour to avoid the 00:00 load spike
    - cron: "37 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: opengrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opengrep:
    name: opengrep/sarif
    # skip fork PRs (see header)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    env:
      # opengrep v1.30.1, released 2026-09-21; sha256 == GitHub release asset digest
      OPENGREP_VERSION: v1.30.1
      OPENGREP_SHA256: d3195b9d8d5ae93179f6aa5f5daaba6a920a5a09d38c5d5ae5e60924050210c4
      # opengrep/opengrep-rules @ 2025-01-26 ("Update README.md")
      RULES_REPO: https://github.com/opengrep/opengrep-rules.git
      RULES_SHA: f1d2b562b414783763fd02a6ed2736eaed622efa
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install opengrep (pinned + sha256 verified)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/opengrep"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o "$bin" \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "${OPENGREP_SHA256}  ${bin}" | sha256sum -c -
          chmod +x "$bin"
          "$bin" --version

      - name: Fetch community rules (pinned commit)
        run: |
          set -euo pipefail
          # cloned inside the workspace (untracked, excluded from the scan)
          # so rule ids are stable: opengrep-community.<lang>.<...>
          d=.opengrep-community
          git init -q "$d"
          git -C "$d" fetch -q --depth 1 "$RULES_REPO" "$RULES_SHA"
          git -C "$d" -c advice.detachedHead=false checkout -q FETCH_HEAD
          test "$(git -C "$d" rev-parse HEAD)" = "$RULES_SHA"
          echo "community rules at $(git -C "$d" rev-parse HEAD)"

      - name: Scan
        run: |
          set -euo pipefail
          # community unsafe-usage is dropped: .opengrep/rules/rust-unsafe.yml
          # reports the same blocks (as INFO notes).
          "$RUNNER_TEMP/opengrep" scan \
            --disable-version-check \
            --config .opengrep-community/rust \
            --config .opengrep-community/javascript \
            --config .opengrep-community/generic/secrets \
            --config .opengrep/rules \
            --exclude ui/vendor \
            --exclude .opengrep-community \
            --exclude-rule opengrep-community.rust.lang.security.unsafe-usage \
            --sarif -o opengrep.sarif .
          test -s opengrep.sarif

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('opengrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: opengrep.sarif
          category: opengrep
