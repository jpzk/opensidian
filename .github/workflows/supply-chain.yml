# SPDX-License-Identifier: GPL-3.0-or-later
#
# Supply chain — CVE scanning and dependency policy (#188); the SBOM + WebKit CVE gate are in release.yml.
#   cargo audit        RustSec advisories against Cargo.lock (--deny warnings)
#   cargo deny         advisories + sources + bans + licenses (deny.toml)
#   cargo vet          every third-party crate audited, imported or exempted (src-tauri/supply-chain/)
#   pin-check          #189: every dependency pinned to exact version + content hash (pin-check.sh, pin-allow.tsv)
#   vendor-js-cve      ui/vendor/vendor.lock.json proven against the npm registry + bytes, then
#                      its SBOM scanned with osv-scanner against the VEX
#   (webkit-bundle-cve moved to release.yml job appimage: it scans the SBOM generated in the build
#                      container, both arches, blocking; G1 was this job installing apt on the runner host)
#   glib-vendor-check  src-tauri/vendor/glib-0.18.5 == crates.io glib 0.18.5 + the one documented patch
#   vex-check          supply-chain/vex.cdx.json == deny.toml / audit.toml ignores, no expired entry
#   gate-tests         scripts/supply-chain/tests/*.test.sh: every gate still turns red on its fixture
#   (no SBOM job: release.yml generates it in the appimage build container,
#                      see the note above codemirror-rebuild)
#   sbom-crosscheck    #299: latest release SBOMs scanned by pinned osv-scanner AND pinned grype, findings diffed
#   codemirror-rebuild opt-in (workflow_dispatch input / weekly cron): rebuild cm6.js, compare sha256
# See docs/supply-chain.md for what each check catches and how to audit a new crate.
#
# Triggers (OPERATOR DECISION 2026-11-17, #188): push to main, develop and release/**, tags v*, the
#   weekly cron, workflow_dispatch, and workflow_call (release.yml calls this workflow and its
#   publish job needs it). There is NO pull_request trigger (and never pull_request_target).
#   CONSEQUENCE, accepted by the operator: cargo vet / cargo deny / cargo audit and the CVE scans
#   no longer gate PRs. An unaudited crate or a vulnerable dependency is only caught AFTER it has
#   landed on develop (the push run turns red), not before the merge. Review new dependencies in
#   the PR by hand; fix forward on develop.
#
# Hardening:
#   - push/tag/schedule/dispatch/call only (see Triggers): nothing here needs secrets or PR context.
#   - top-level permissions contents: read; no secrets; checkout does not persist the token. No job needs
#     id-token or attestations (attest-sbom was removed with the CI SBOM, 2026-11-19).
#   - every action pinned to a full commit SHA (# vX.Y.Z) and the Rust toolchain pinned; every
#     pin released >= 6 weeks before pin time (2026-11-15).
#   - SCANNERS (operator decision 2026-11-19 15:49Z, supersedes the 2026-11-15 / 2026-11-17
#     "scanners float unpinned" exception): cargo-audit, cargo-deny, cargo-vet and osv-scanner
#     track the NEWEST upstream release (exception to the 6-week rule for scanners only) but are
#     PINNED by version + sha256, fail closed. cargo: `cargo install --locked --version =<v>`, then
#     scripts/supply-chain/cargo-scanner-verify.sh (installed version == cargo-scanners.pins and
#     the .crate it was built from has the pinned sha256, else the binary is removed and the job
#     fails). osv-scanner: osv-install.sh, pinned only (per-arch sha256 from osv-scanner.pins; the
#     unpinned latest mode was removed). Advisory DATA is fetched fresh on every run (RustSec DB
#     by cargo audit / cargo deny fetch, OSV through the live API); advisory-db-rev.sh logs the
#     fetched revision and fails on a missing or stale DB. Bumps: weekly PR from
#     snapshot-bump.yml, never auto-merged. Everything else stays pinned under the 6-week rule.
#   - no caches: nothing a PR run writes can be restored by a push/main run.
name: Supply chain

on:
  # see "Triggers" in the header: NO pull_request / pull_request_target (operator 2026-11-17).
  # Note: release.yml's v<ver>-release branches are not matched; release branches are
  # expected under release/**. release.yml reaches this workflow through workflow_call.
  push:
    branches: [main, develop, 'release/**']
    tags: ['v*']
  schedule:
    # weekly: new RustSec / OSV advisories land without any change to this repo
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      codemirror_rebuild:
        description: 'also run the opt-in CodeMirror reproducible-rebuild check'
        type: boolean
        default: false
      sbom_run:
        description: 'Release run id: cross-check THAT run''s CI-built SBOMs (must be built from this ref''s commit) instead of the latest release'
        type: string
        default: ''
  # (the `attest` input fed the attest-sbom job, removed 2026-11-19; sbom_run added for #299)
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the CALLER's name under workflow_call, so a tag push running this
  # workflow directly and release.yml calling it on the same tag do not cancel each other.
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: '1.98.0'        # = rust-toolchain.toml = release.yml (released 2026-08-20); checked by rust-toolchain.sh
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: '5'

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: toolchain ${{ env.RUST_TOOLCHAIN }}
        run: |
          bash scripts/supply-chain/rust-toolchain.sh   # manifest sha256 + rustc commit (rust-toolchain.toml)
          cargo --version
      - name: install cargo-audit (pinned, scripts/supply-chain/cargo-scanners.pins)
        run: |
          cargo install --locked --version =0.23.0 cargo-audit
          bash scripts/supply-chain/cargo-scanner-verify.sh cargo-audit
          cargo audit --version
      - name: cargo audit
        # the RustSec advisory DB is fetched fresh at run time (data, not code; a failed fetch fails
        # cargo audit); the fetched revision is recorded right after. Ignores: src-tauri/audit.toml
        working-directory: src-tauri
        run: |
          cargo audit --deny warnings
          bash ../scripts/supply-chain/advisory-db-rev.sh cargo-audit "${CARGO_HOME:-$HOME/.cargo}/advisory-db"

  deny:
    name: cargo deny
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: toolchain ${{ env.RUST_TOOLCHAIN }}
        run: |
          bash scripts/supply-chain/rust-toolchain.sh   # manifest sha256 + rustc commit (rust-toolchain.toml)
          cargo --version
      - name: install cargo-deny (pinned, scripts/supply-chain/cargo-scanners.pins)
        run: |
          cargo install --locked --version =0.22.0 cargo-deny
          bash scripts/supply-chain/cargo-scanner-verify.sh cargo-deny
          cargo deny --version
      - name: fetch the advisory DB fresh (a failed fetch fails the gate) + record its revision
        run: |
          cargo deny --manifest-path src-tauri/Cargo.toml --config deny.toml fetch db
          bash scripts/supply-chain/advisory-db-rev.sh cargo-deny "${CARGO_HOME:-$HOME/.cargo}"/advisory-dbs/*
      - name: cargo deny check
        run: cargo deny --manifest-path src-tauri/Cargo.toml --config deny.toml --locked check --show-stats

  vet:
    name: cargo vet
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: toolchain ${{ env.RUST_TOOLCHAIN }}
        run: |
          bash scripts/supply-chain/rust-toolchain.sh   # manifest sha256 + rustc commit (rust-toolchain.toml)
          cargo --version
      - name: install cargo-vet (pinned, scripts/supply-chain/cargo-scanners.pins)
        run: |
          cargo install --locked --version =0.10.3 cargo-vet
          bash scripts/supply-chain/cargo-scanner-verify.sh cargo-vet
          cargo vet --version
      - name: cargo vet --locked
        # --locked: use imports.lock as committed (no fresh import fetch) and Cargo.lock as is;
        # any new or updated crate without an audit/exemption fails here
        working-directory: src-tauri
        run: cargo vet --locked

  pin-check:
    # #189: every dependency outside the named scanner exception is pinned to an exact version AND
    # a content hash (uses@sha, image@sha256, apt pkg=ver, dnf pkg-ver, cargo install --locked
    # --version, flatpak --commit, curl/wget + sha256sum, no npm/npx/go install/unhashed pip).
    # Allowlist: supply-chain/pin-allow.tsv (rule, path, needle, expiry, scanner, reason).
    # Pure bash + grep/sed: no tool install, no network, nothing to pin.
    name: pin-check
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: pin-check self-test (one red fixture per rule + mutations of a green tree)
        run: bash scripts/supply-chain/tests/pin-check.test.sh
      - name: pin-check on the repository
        run: bash scripts/supply-chain/pin-check.sh

  vendor-js-cve:
    name: vendored JS (lock proof + CVE)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: vendor-verify (registry integrity, tarball bytes, embedded versions, coverage, 6-week rule)
        run: scripts/supply-chain/vendor-verify.sh
      - name: vendor SBOM from vendor.lock.json + codemirror/build/package-lock.json
        run: |
          mkdir -p "$RUNNER_TEMP/sbom"
          scripts/supply-chain/vendor-sbom.sh > "$RUNNER_TEMP/sbom/vendor.cdx.json"
          jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.6"' "$RUNNER_TEMP/sbom/vendor.cdx.json"
          echo "components: $(jq '.components | length' "$RUNNER_TEMP/sbom/vendor.cdx.json")"
      # scan input only, never uploaded (the release SBOM is generated in release.yml job appimage)
      - name: osv-scanner (pinned version + per-arch sha256, scripts/supply-chain/osv-scanner.pins)
        run: |
          bin=$(scripts/supply-chain/osv-install.sh --pinned "$RUNNER_TEMP/osv")
          echo "OSV advisory data: live api.osv.dev query at $(date -u +%Y-%m-%dT%H:%M:%SZ) (fresh every run; a failed query fails the scan)"
          echo "OSV=$bin" >> "$GITHUB_ENV"
      - name: osv scan vendor SBOM against the VEX
        run: |
          # config OUTSIDE the SBOM dir: osv-scanner auto-loads an osv-scanner.toml next to the input
          mkdir -p "$RUNNER_TEMP/osvcfg"
          scripts/supply-chain/vex-osv-config.sh > "$RUNNER_TEMP/osvcfg/osv-scanner.toml"
          "$OSV" scan source --config "$RUNNER_TEMP/osvcfg/osv-scanner.toml" -L "$RUNNER_TEMP/sbom/vendor.cdx.json"

  # webkit-bundle-cve: MOVED to release.yml (job appimage, both arches), 2026-11-19 (#249). It
  # installed the apt set on the runner HOST and generated the WebKit SBOM part there, so what it
  # scanned was not what ships (G1). The release job now scans the WebKit part generated INSIDE the
  # appimage-build.sh container, from the dpkg database the portable AppImage was bundled from,
  # and stays BLOCKING for draft-release (osv-fixed-gate.sh, same rule).

  glib-vendor-check:
    name: glib vendor check
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: vendor/glib-0.18.5 == crates.io glib 0.18.5 + glib-fix/variantstriter.patch only
        run: scripts/supply-chain/glib-vendor-check.sh

  vex-check:
    name: VEX check
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: VEX == deny.toml / audit.toml ignores, nothing expired
        run: scripts/supply-chain/vex-check.sh

  sbom-crosscheck:
    name: SBOM cross-check (osv-scanner vs grype)
    permissions:
      contents: read
      actions: read   # fetch-android: the sbom-scan-android artifact of the latest successful SBOM scan run
    # #299: the SAME SBOMs as code scanning (latest PUBLISHED release, every *.cdx.json asset, each verified
    # against its .sha256 asset; android = artifact sbom-scan-android of the latest successful SBOM
    # scan run, digest-verified) scanned by two independent scanners, both pinned by version +
    # per-arch sha256 (osv-scanner.pins, grype.pins): a CVE one scanner misses shows up as a
    # one-sided row in crosscheck-diff.tsv. Informational: findings do not fail the job (the
    # gates are cargo audit / deny and release.yml); a scanner that does not complete DOES.
    # Advisory data (osv offline DBs, grype DB) is fetched fresh by this run. Logic + self-test:
    # scripts/supply-chain/sbom-crosscheck.sh, tests/sbom-crosscheck.test.sh.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: install pinned osv-scanner + grype (sha256-verified)
        run: |
          osv=$(scripts/supply-chain/osv-install.sh "$RUNNER_TEMP/osv")      # a bare assignment fails the step;
          grype=$(scripts/supply-chain/grype-install.sh "$RUNNER_TEMP/grype") # echo "X=$(...)" would not
          printf "OSV=%s\nGRYPE=%s\n" "$osv" "$grype" >> "$GITHUB_ENV"
      - name: fetch + verify the latest published release's SBOMs (or, with input sbom_run, that Release run's)
        env:
          SBOM_RUN: ${{ inputs.sbom_run }}
        run: |
          if [ -n "${SBOM_RUN:-}" ]; then
            # #299: the CI-built SBOMs of the commit under test (release dry_run), not the published ones
            scripts/supply-chain/sbom-crosscheck.sh fetch-run "$SBOM_RUN" "$GITHUB_SHA" "$RUNNER_TEMP/xc/sbom" >/dev/null
            echo "TAG=release run $SBOM_RUN @ ${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
            exit 0
          fi
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          SBOMS=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name | select(endswith(".cdx.json"))] | join(" ")')
          [ -n "$SBOMS" ] || { echo "::error::release $tag has no *.cdx.json asset"; exit 1; }
          echo "release $tag: $SBOMS"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          SBOMS=$SBOMS scripts/supply-chain/sbom-crosscheck.sh fetch "$tag" "$RUNNER_TEMP/xc/sbom"
      - name: fetch + verify the android SBOMs (artifact of the latest successful SBOM scan run)
        run: |
          run=$(scripts/supply-chain/sbom-crosscheck.sh fetch-android "$RUNNER_TEMP/xc/sbom")   # fails the step on error
          echo "ANDROID_RUN=$run" >> "$GITHUB_ENV"
      - name: grype DB (fresh)
        run: |
          export GRYPE_DB_CACHE_DIR=$RUNNER_TEMP/grypedb GRYPE_CHECK_FOR_APP_UPDATE=false
          "$GRYPE" db update
          "$GRYPE" db status
      - name: scan each SBOM with both scanners, normalize, diff
        run: |
          export GRYPE_DB_CACHE_DIR=$RUNNER_TEMP/grypedb GRYPE_CHECK_FOR_APP_UPDATE=false GRYPE_DB_AUTO_UPDATE=false
          export OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY=$RUNNER_TEMP/osvdb
          x=scripts/supply-chain/sbom-crosscheck.sh o=$RUNNER_TEMP/xc/out
          mkdir -p "$o/raw"; : > "$o/osv.tsv"; : > "$o/grype.tsv"
          for f in "$RUNNER_TEMP"/xc/sbom/*.cdx.json; do
            l=$(basename "$f" .cdx.json)
            echo "::group::$l"
            scripts/supply-chain/osv-json.sh "$o/raw/$l.osv.json" "$OSV" scan source --offline-vulnerabilities \
              --download-offline-databases --format json -L "$f"
            "$GRYPE" "sbom:$f" -o json --file "$o/raw/$l.grype.json"
            "$x" norm-osv "$o/raw/$l.osv.json" "$l" >> "$o/osv.tsv"
            "$x" norm-grype "$o/raw/$l.grype.json" "$l" >> "$o/grype.tsv"
            echo "::endgroup::"
          done
          "$x" diff "$o/osv.tsv" "$o/grype.tsv" > "$o/crosscheck-diff.tsv"
          { echo "### SBOM cross-check $TAG + android SBOMs of SBOM scan run $ANDROID_RUN (osv-scanner $(awk '$1=="version"{print $2}' scripts/supply-chain/osv-scanner.pins) vs grype $(awk '$1=="version"{print $2}' scripts/supply-chain/grype.pins))"
            "$x" summary "$o/crosscheck-diff.tsv"
            echo; echo "rows: matched by id/alias per sbom+package+version; one-sided rows in artifact crosscheck-diff.tsv"
          } >> "$GITHUB_STEP_SUMMARY"
          cut -f1 "$o/crosscheck-diff.tsv" | sort | uniq -c
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-crosscheck
          path: ${{ runner.temp }}/xc/
          if-no-files-found: error
          retention-days: 14

  gate-tests:
    name: supply-chain gate self-tests (red fixtures)
    # every gate must still turn red on its fixture (past-expiry VEX, pdfjs-dist 4.1.392,
    # unlisted ui/vendor file, yanked glib, ldd "not found", failed osv scan, ...): a gate that
    # silently stopped failing would leave every other job here green for the wrong reason.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: scripts/supply-chain/tests/*.test.sh
        run: |
          rc=0
          for f in scripts/supply-chain/tests/*.test.sh; do
            echo "::group::$f"
            bash "$f" || { rc=1; echo "::error::$f failed"; }
            echo "::endgroup::"
          done
          exit "$rc"

  # SBOM: NOT produced here. The release SBOM is generated by release.yml (job appimage, inside the
  # pinned build container, sbom-local.sh --release) and attached to the draft release; the former
  # jobs `sbom` / `attest-sbom` (merge on the runner host) are gone. vendor-js-cve's vendor part is a
  # scan input only (tree-derived from vendor.lock.json, never uploaded).

  # Opt-in (workflow_dispatch input codemirror_rebuild / weekly cron): rebuild
  # ui/vendor/codemirror/cm6.js from ui/vendor/codemirror/build/ and fail unless the sha256
  # equals the committed bundle (and vendor.lock.json). The ONLY job with node tooling.
  #   node     v24.21.0 (LTS, released 2026-09-07), tarball pinned by sha256 below (= its SHASUMS256)
  #   esbuild  0.28.2 + @esbuild/linux-x64 0.28.2 (published 2026-08-08), pinned by the sha512
  #            integrity in build/package-lock.json, which vendor-js-cve proves against the registry
  #   network  npm ci talks to registry.npmjs.org only (npm_config_registry; every lock
  #            "resolved" is a registry tarball, checked by vendor-verify.sh) with
  #            --ignore-scripts; the esbuild bundle step then runs in a network namespace with
  #            no interfaces but lo (ESBUILD_WRAP), so it can only use what npm ci fetched.
  codemirror-rebuild:
    name: CodeMirror reproducible rebuild
    if: ${{ github.event_name == 'schedule' || inputs.codemirror_rebuild }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      NODE_VERSION: v24.21.0
      NODE_SHA256: fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: install pinned node (sha256-verified)
        run: |
          set -euo pipefail
          f="node-${NODE_VERSION}-linux-x64.tar.xz"
          curl -4 -fsSL --retry 3 -m 120 -o "$RUNNER_TEMP/$f" "https://nodejs.org/dist/${NODE_VERSION}/$f"
          echo "${NODE_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-${NODE_VERSION}-linux-x64/bin" >> "$GITHUB_PATH"
      - name: every build/package-lock.json entry published on or before the pin cutoff
        run: sh ui/vendor/codemirror/build/build.sh check
      - name: rebuild cm6.js (bundle step without network) and compare sha256
        run: |
          set -euo pipefail
          test "$(node --version)" = "$NODE_VERSION"
          wrap="sudo unshare --net -- setpriv --reuid=$(id -u) --regid=$(id -g) --clear-groups env PATH=$PATH"
          # the namespace really has no route out
          if $wrap curl -4 -fsS -m 5 -o /dev/null https://registry.npmjs.org/; then
            echo "::error::network namespace is not isolated"; exit 1
          fi
          want=$(jq -r '.bundles[] | select(.name == "codemirror") | .sha256' ui/vendor/vendor.lock.json)
          test "$(sha256sum ui/vendor/codemirror/cm6.js | cut -d' ' -f1)" = "$want"
          ESBUILD_WRAP="$wrap" CMP=ui/vendor/codemirror/cm6.js \
            sh ui/vendor/codemirror/build/build.sh | tee "$RUNNER_TEMP/rebuild.log"
          {
            echo "### CodeMirror rebuild"
            echo "node $(node --version), $(grep -m1 -E '^[0-9]+\.[0-9]+\.[0-9]+$' "$RUNNER_TEMP/rebuild.log" | sed 's/^/esbuild /')"
            grep -E '^CM6-' "$RUNNER_TEMP/rebuild.log"
          } >> "$GITHUB_STEP_SUMMARY"
