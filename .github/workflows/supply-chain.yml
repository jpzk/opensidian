# SPDX-License-Identifier: GPL-3.0-or-later
#
# Supply chain — the ONE workflow for CVE scanning and dependency policy (#188); the SBOM is local.
#   cargo audit        RustSec advisories against Cargo.lock (--deny warnings)
#   cargo deny         advisories + sources + bans + licenses (deny.toml)
#   cargo vet          every third-party crate audited, imported or exempted (src-tauri/supply-chain/)
#   pin-check          #189: every dependency pinned to exact version + content hash (pin-check.sh, pin-allow.tsv)
#   vendor-js-cve      ui/vendor/vendor.lock.json proven against the npm registry + bytes, then
#                      its SBOM scanned with osv-scanner against the VEX
#   webkit-bundle-cve  the WebKitGTK/GTK closure the PORTABLE AppImage bundles (ubuntu-26.04 dpkg
#                      database -> pkg:deb/ubuntu source packages); fails on CVEs with a fix available
#   glib-vendor-check  src-tauri/vendor/glib-0.18.5 == crates.io glib 0.18.5 + the one documented patch
#   vex-check          supply-chain/vex.cdx.json == deny.toml / audit.toml ignores, no expired entry
#   gate-tests         scripts/supply-chain/tests/*.test.sh: every gate still turns red on its fixture
#   (no SBOM job: operator 2026-11-19, the merged SBOM is built locally with
#                      scripts/supply-chain/sbom-local.sh, see the note above codemirror-rebuild)
#   codemirror-rebuild opt-in (workflow_dispatch input / weekly cron): rebuild cm6.js, compare sha256
# See docs/supply-chain.md for what each check catches and how to audit a new crate.
#
# Triggers (OPERATOR DECISION 2026-11-17, #188): push to main, develop and release/**, tags v*, the
#   weekly cron, workflow_dispatch, and workflow_call (release.yml calls this workflow and its
#   publish job needs it). There is NO pull_request trigger (and never pull_request_target).
#   CONSEQUENCE, accepted by the operator: cargo vet / cargo deny / cargo audit and the CVE scans
#   no longer gate PRs. An unaudited crate or a vulnerable dependency is only caught AFTER it has
#   landed on develop (the push run turns red), not before the merge. Review new dependencies in
#   the PR by hand; fix forward on develop.
#
# Hardening:
#   - push/tag/schedule/dispatch/call only (see Triggers): nothing here needs secrets or PR context.
#   - top-level permissions contents: read; no secrets (github.token only raises the GitHub API
#     rate limit for osv-install.sh); checkout does not persist the token. No job needs
#     id-token or attestations (attest-sbom was removed with the CI SBOM, 2026-11-19).
#   - every action pinned to a full commit SHA (# vX.Y.Z) and the Rust toolchain pinned; every
#     pin released >= 6 weeks before pin time (2026-11-15).
#   - EXCEPTION (operator decision 2026-11-15): cargo-audit, cargo-deny and cargo-vet are NOT
#     pinned. Each run installs the latest crates.io release (still --locked, so the tool's own
#     Cargo.lock is used) and logs the resolved version in a "resolved version" step. They are
#     vulnerability scanners whose advisory DB / formats move: an old release can fail to parse
#     new advisories and silently stop protecting us. Blast radius is bounded: contents: read,
#     no secrets, no caches, no privileged (pull_request_target) trigger.
#     Same exception for osv-scanner (operator 2026-11-17, #189 item 3: "dont pin scanners in
#     workflow but everything else"): scripts/supply-chain/osv-install.sh installs the latest
#     non-prerelease GitHub release, verifies the asset against the sha256 digest from the GitHub
#     release API (fails closed without one, same pattern as opengrep.yml) and logs the resolved
#     version + digest. Everything else (actions, toolchain, node/esbuild) stays pinned.
#   - no caches: nothing a PR run writes can be restored by a push/main run.
name: Supply chain

on:
  # see "Triggers" in the header: NO pull_request / pull_request_target (operator 2026-11-17).
  # Note: release.yml's v<ver>-release branches are not matched; release branches are
  # expected under release/**. release.yml reaches this workflow through workflow_call.
  push:
    branches: [main, develop, 'release/**']
    tags: ['v*']
  schedule:
    # weekly: new RustSec / OSV advisories land without any change to this repo
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      codemirror_rebuild:
        description: 'also run the opt-in CodeMirror reproducible-rebuild check'
        type: boolean
        default: false
  # no inputs since 2026-11-19 (the `attest` input fed the removed attest-sbom job)
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the CALLER's name under workflow_call, so a tag push running this
  # workflow directly and release.yml calling it on the same tag do not cancel each other.
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: '1.98.0'        # = rust-toolchain.toml = release.yml (released 2026-08-20); checked by rust-toolchain.sh
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: '5'

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: toolchain ${{ env.RUST_TOOLCHAIN }}
        run: |
          bash scripts/supply-chain/rust-toolchain.sh   # manifest sha256 + rustc commit (rust-toolchain.toml)
          cargo --version
      - name: install cargo-audit (latest crates.io release, unpinned by design)
        run: cargo install --locked cargo-audit
      - name: cargo-audit resolved version
        run: cargo audit --version
      - name: cargo audit
        # the RustSec advisory DB is fetched at run time (not pinned); ignores live in
        # src-tauri/audit.toml with reason + expiry
        working-directory: src-tauri
        run: cargo audit --deny warnings

  deny:
    name: cargo deny
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: toolchain ${{ env.RUST_TOOLCHAIN }}
        run: |
          bash scripts/supply-chain/rust-toolchain.sh   # manifest sha256 + rustc commit (rust-toolchain.toml)
          cargo --version
      - name: install cargo-deny (latest crates.io release, unpinned by design)
        run: cargo install --locked cargo-deny
      - name: cargo-deny resolved version
        run: cargo deny --version
      - name: cargo deny check
        run: cargo deny --manifest-path src-tauri/Cargo.toml --config deny.toml --locked check --show-stats

  vet:
    name: cargo vet
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: toolchain ${{ env.RUST_TOOLCHAIN }}
        run: |
          bash scripts/supply-chain/rust-toolchain.sh   # manifest sha256 + rustc commit (rust-toolchain.toml)
          cargo --version
      - name: install cargo-vet (latest crates.io release, unpinned by design)
        run: cargo install --locked cargo-vet
      - name: cargo-vet resolved version
        run: cargo vet --version
      - name: cargo vet --locked
        # --locked: use imports.lock as committed (no fresh import fetch) and Cargo.lock as is;
        # any new or updated crate without an audit/exemption fails here
        working-directory: src-tauri
        run: cargo vet --locked

  pin-check:
    # #189: every dependency outside the named scanner exception is pinned to an exact version AND
    # a content hash (uses@sha, image@sha256, apt pkg=ver, dnf pkg-ver, cargo install --locked
    # --version, flatpak --commit, curl/wget + sha256sum, no npm/npx/go install/unhashed pip).
    # Allowlist: supply-chain/pin-allow.tsv (rule, path, needle, expiry, scanner, reason).
    # Pure bash + grep/sed: no tool install, no network, nothing to pin.
    name: pin-check
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: pin-check self-test (one red fixture per rule + mutations of a green tree)
        run: bash scripts/supply-chain/tests/pin-check.test.sh
      - name: pin-check on the repository
        run: bash scripts/supply-chain/pin-check.sh

  vendor-js-cve:
    name: vendored JS (lock proof + CVE)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: vendor-verify (registry integrity, tarball bytes, embedded versions, coverage, 6-week rule)
        run: scripts/supply-chain/vendor-verify.sh
      - name: vendor SBOM from vendor.lock.json + codemirror/build/package-lock.json
        run: |
          mkdir -p "$RUNNER_TEMP/sbom"
          scripts/supply-chain/vendor-sbom.sh > "$RUNNER_TEMP/sbom/vendor.cdx.json"
          jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.6"' "$RUNNER_TEMP/sbom/vendor.cdx.json"
          echo "components: $(jq '.components | length' "$RUNNER_TEMP/sbom/vendor.cdx.json")"
      # scan input only: not uploaded as an SBOM part since 2026-11-19 (SBOM is local, sbom-local.sh)
      - name: osv-scanner (latest release, digest-verified, unpinned by design)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin=$(scripts/supply-chain/osv-install.sh "$RUNNER_TEMP/osv")
          echo "OSV=$bin" >> "$GITHUB_ENV"
      - name: osv scan vendor SBOM against the VEX
        run: |
          # config OUTSIDE the SBOM dir: osv-scanner auto-loads an osv-scanner.toml next to the input
          mkdir -p "$RUNNER_TEMP/osvcfg"
          scripts/supply-chain/vex-osv-config.sh > "$RUNNER_TEMP/osvcfg/osv-scanner.toml"
          "$OSV" scan source --config "$RUNNER_TEMP/osvcfg/osv-scanner.toml" -L "$RUNNER_TEMP/sbom/vendor.cdx.json"

  webkit-bundle-cve:
    # Scans what the PORTABLE AppImage bundles: build-appimage.sh portable copies the
    # WebKitGTK/GTK closure of packaging/ci/appimage-build.sh (snapshot.ubuntu.com SNAP, PKGS pinned
    # pkg=version, #189) into the AppImage; webkit-apt.sh installs that same pinned set here.
    # The slim AppImage, the .deb and the flatpak bundle NO WebKit: they use the
    # system's / the org.gnome.Platform runtime's WebKit, which is the distro's / Flathub's to patch.
    # Only x86_64 is scanned (ubuntu-26.04-arm installs the same source packages).
    name: WebKit bundle CVE (AppImage closure, ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: system packages (= appimage-build.sh PKGS from snapshot.ubuntu.com SNAP, pinned pkg=version, #189)
        run: bash scripts/supply-chain/webkit-apt.sh
      - name: WebKit bundle SBOM (ldd closure -> dpkg -S -> source packages)
        run: |
          mkdir -p "$RUNNER_TEMP/sbom"
          scripts/supply-chain/webkit-bundle-sbom.sh > "$RUNNER_TEMP/sbom/webkit-bundle.cdx.json"
          echo "components: $(jq '.components | length' "$RUNNER_TEMP/sbom/webkit-bundle.cdx.json")"
      # scan input only: not uploaded as an SBOM part since 2026-11-19 (SBOM is local, sbom-local.sh)
      - name: osv-scanner (latest release, digest-verified, unpinned by design)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin=$(scripts/supply-chain/osv-install.sh "$RUNNER_TEMP/osv")
          echo "OSV=$bin" >> "$GITHUB_ENV"
      - name: osv scan + gate (fail only on CVEs with a fixed Ubuntu version)
        run: |
          mkdir -p "$RUNNER_TEMP/osvcfg"
          scripts/supply-chain/vex-osv-config.sh > "$RUNNER_TEMP/osvcfg/osv-scanner.toml"
          # osv-scanner exits 1 on ANY match, including not-yet-fixed distro CVEs; osv-json.sh accepts
          # rc 0/1 only (127/128 = failed scan) and checks the JSON; the gate decides on the findings
          scripts/supply-chain/osv-json.sh "$RUNNER_TEMP/osv-webkit.json" \
            "$OSV" scan source --config "$RUNNER_TEMP/osvcfg/osv-scanner.toml" --format json \
            -L "$RUNNER_TEMP/sbom/webkit-bundle.cdx.json"
          scripts/supply-chain/osv-fixed-gate.sh "$RUNNER_TEMP/osv-webkit.json"

  glib-vendor-check:
    name: glib vendor check
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: vendor/glib-0.18.5 == crates.io glib 0.18.5 + glib-fix/variantstriter.patch only
        run: scripts/supply-chain/glib-vendor-check.sh

  vex-check:
    name: VEX check
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: VEX == deny.toml / audit.toml ignores, nothing expired
        run: scripts/supply-chain/vex-check.sh

  gate-tests:
    name: supply-chain gate self-tests (red fixtures)
    # every gate must still turn red on its fixture (past-expiry VEX, pdfjs-dist 4.1.392,
    # unlisted ui/vendor file, yanked glib, ldd "not found", failed osv scan, ...): a gate that
    # silently stopped failing would leave every other job here green for the wrong reason.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: scripts/supply-chain/tests/*.test.sh
        run: |
          rc=0
          for f in scripts/supply-chain/tests/*.test.sh; do
            echo "::group::$f"
            bash "$f" || { rc=1; echo "::error::$f failed"; }
            echo "::endgroup::"
          done
          exit "$rc"

  # SBOM: NOT produced in CI (OPERATOR DECISION 2026-11-19: "lets deactivate now lets only run the
  # sbom locally"). The former jobs `sbom` (merge + osv scan of the merged SBOM) and `attest-sbom`
  # (actions/attest-sbom) are removed, and the vendor / WebKit parts are no longer uploaded as
  # sbom-part-* artifacts. Their CVE scans stay above (vendor-js-cve, webkit-bundle-cve: each still
  # generates its part in-job and scans it); the cargo side stays covered by cargo audit / deny.
  # The release SBOM is built on the release build machine with scripts/supply-chain/sbom-local.sh
  # (rust + vendor + flatpak + WebKit bundle -> sbom-merge.sh, fails closed on a missing part) and
  # uploaded to the draft release by hand: docs/RELEASING.md "SBOM (local)".

  # Opt-in (workflow_dispatch input codemirror_rebuild / weekly cron): rebuild
  # ui/vendor/codemirror/cm6.js from ui/vendor/codemirror/build/ and fail unless the sha256
  # equals the committed bundle (and vendor.lock.json). The ONLY job with node tooling.
  #   node     v24.21.0 (LTS, released 2026-09-07), tarball pinned by sha256 below (= its SHASUMS256)
  #   esbuild  0.28.2 + @esbuild/linux-x64 0.28.2 (published 2026-08-08), pinned by the sha512
  #            integrity in build/package-lock.json, which vendor-js-cve proves against the registry
  #   network  npm ci talks to registry.npmjs.org only (npm_config_registry; every lock
  #            "resolved" is a registry tarball, checked by vendor-verify.sh) with
  #            --ignore-scripts; the esbuild bundle step then runs in a network namespace with
  #            no interfaces but lo (ESBUILD_WRAP), so it can only use what npm ci fetched.
  codemirror-rebuild:
    name: CodeMirror reproducible rebuild
    if: ${{ github.event_name == 'schedule' || inputs.codemirror_rebuild }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      NODE_VERSION: v24.21.0
      NODE_SHA256: fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: install pinned node (sha256-verified)
        run: |
          set -euo pipefail
          f="node-${NODE_VERSION}-linux-x64.tar.xz"
          curl -4 -fsSL --retry 3 -m 120 -o "$RUNNER_TEMP/$f" "https://nodejs.org/dist/${NODE_VERSION}/$f"
          echo "${NODE_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-${NODE_VERSION}-linux-x64/bin" >> "$GITHUB_PATH"
      - name: every build/package-lock.json entry published on or before the pin cutoff
        run: sh ui/vendor/codemirror/build/build.sh check
      - name: rebuild cm6.js (bundle step without network) and compare sha256
        run: |
          set -euo pipefail
          test "$(node --version)" = "$NODE_VERSION"
          wrap="sudo unshare --net -- setpriv --reuid=$(id -u) --regid=$(id -g) --clear-groups env PATH=$PATH"
          # the namespace really has no route out
          if $wrap curl -4 -fsS -m 5 -o /dev/null https://registry.npmjs.org/; then
            echo "::error::network namespace is not isolated"; exit 1
          fi
          want=$(jq -r '.bundles[] | select(.name == "codemirror") | .sha256' ui/vendor/vendor.lock.json)
          test "$(sha256sum ui/vendor/codemirror/cm6.js | cut -d' ' -f1)" = "$want"
          ESBUILD_WRAP="$wrap" CMP=ui/vendor/codemirror/cm6.js \
            sh ui/vendor/codemirror/build/build.sh | tee "$RUNNER_TEMP/rebuild.log"
          {
            echo "### CodeMirror rebuild"
            echo "node $(node --version), $(grep -m1 -E '^[0-9]+\.[0-9]+\.[0-9]+$' "$RUNNER_TEMP/rebuild.log" | sed 's/^/esbuild /')"
            grep -E '^CM6-' "$RUNNER_TEMP/rebuild.log"
          } >> "$GITHUB_STEP_SUMMARY"
