# SPDX-License-Identifier: GPL-3.0-or-later
#
# Supply chain — what the Rust dependency graph (src-tauri/Cargo.lock) may contain.
#   cargo audit   RustSec advisories against Cargo.lock (--deny warnings)
#   cargo deny    advisories + sources + bans + licenses (deny.toml)
#   cargo vet     every third-party crate audited, imported or exempted (src-tauri/supply-chain/)
# See docs/supply-chain.md for what each check catches and how to audit a new crate.
#
# Hardening:
#   - push/schedule/dispatch only (no pull_request, never pull_request_target): nothing here
#     needs secrets or PR context.
#   - top-level permissions contents: read; no secrets; checkout does not persist the token.
#   - every action pinned to a full commit SHA (# vX.Y.Z) and the Rust toolchain pinned; every
#     pin released >= 6 weeks before pin time (2026-11-15).
#   - EXCEPTION (operator decision 2026-11-15): cargo-audit, cargo-deny and cargo-vet are NOT
#     pinned. Each run installs the latest crates.io release (still --locked, so the tool's own
#     Cargo.lock is used) and logs the resolved version in a "resolved version" step. They are
#     vulnerability scanners whose advisory DB / formats move: an old release can fail to parse
#     new advisories and silently stop protecting us. Blast radius is bounded: contents: read,
#     no secrets, no caches, no privileged (pull_request_target) trigger.
#   - no caches: nothing a PR run writes can be restored by a push/main run.
name: Supply chain

on:
  # NO pull_request trigger (operator 2026-11-15): scans run only on pushes to develop, main and
  # v* branches (release branches / drafts, v<ver>-release, see release.yml) + schedule + dispatch.
  push:
    branches: [develop, main, 'v*']
  schedule:
    # weekly: new RustSec advisories land without any change to this repo
    - cron: '23 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: '1.98.0'        # = release.yml (released 2026-08-20)
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: '5'

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: toolchain ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          cargo --version
      - name: install cargo-audit (latest crates.io release, unpinned by design)
        run: cargo install --locked cargo-audit
      - name: cargo-audit resolved version
        run: cargo audit --version
      - name: cargo audit
        # the RustSec advisory DB is fetched at run time (not pinned); ignores live in
        # src-tauri/audit.toml with reason + expiry
        working-directory: src-tauri
        run: cargo audit --deny warnings

  deny:
    name: cargo deny
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: toolchain ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          cargo --version
      - name: install cargo-deny (latest crates.io release, unpinned by design)
        run: cargo install --locked cargo-deny
      - name: cargo-deny resolved version
        run: cargo deny --version
      - name: cargo deny check
        run: cargo deny --manifest-path src-tauri/Cargo.toml --config deny.toml --locked check --show-stats

  vet:
    name: cargo vet
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: toolchain ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          cargo --version
      - name: install cargo-vet (latest crates.io release, unpinned by design)
        run: cargo install --locked cargo-vet
      - name: cargo-vet resolved version
        run: cargo vet --version
      - name: cargo vet --locked
        # --locked: use imports.lock as committed (no fresh import fetch) and Cargo.lock as is;
        # any new or updated crate without an audit/exemption fails here
        working-directory: src-tauri
        run: cargo vet --locked

  pin-check:
    # #189: every dependency outside the named scanner exception is pinned to an exact version AND
    # a content hash (uses@sha, image@sha256, apt pkg=ver, dnf pkg-ver, cargo install --locked
    # --version, flatpak --commit, curl/wget + sha256sum, no npm/npx/go install/unhashed pip).
    # Allowlist: supply-chain/pin-allow.tsv (rule, path, needle, expiry, scanner, reason).
    # Pure bash + grep/sed: no tool install, no network, nothing to pin.
    name: pin-check
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: pin-check self-test (one red fixture per rule + mutations of a green tree)
        run: bash scripts/supply-chain/tests/pin-check.test.sh
      - name: pin-check on the repository
        run: bash scripts/supply-chain/pin-check.sh
